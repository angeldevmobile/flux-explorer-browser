use_default_settings: true

server:
  # La clave real se pasa por la variable de entorno SEARXNG_SECRET_KEY,
  # que sobreescribe este valor. Nunca poner aquí una clave de verdad:
  # este archivo está en un repositorio público.
  # Generar una con: python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "cambiar-por-variable-de-entorno"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "es"
  formats:
    - html
    - json

ui:
  default_theme: simple
  query_in_title: true
